name: Update Major Notices

on:
  schedule:
    - cron: "0 10 * * *"    # 매일 한국시간 19:00 (UTC 10:00) 실행
  workflow_dispatch: 

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub 레포지토리 체크아웃
        uses: actions/checkout@v4  

      - name: Python 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Python 패키지 캐싱
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
      
      - name: Playwright 브라우저 캐싱
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright 
          key: playwright-${{ runner.os }}
          restore-keys: |
            playwright-
      
      - name: Playwright 설치 (캐싱 활용)
        run: python3 -m playwright install --with-deps

      - name: Firebase 인증키 설정 및 실행
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" | base64 --decode > firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=firebase-key.json
          export PYTHONPATH=$(pwd)
          python crawler/actions_major_notice.py